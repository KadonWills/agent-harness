[package]
name = "harness-runtime"
description = "Sandboxed execution driver for agent-generated code (Docker / Wasmtime backends)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# WASI sandbox backend. Follows Wasmtime's MSRV, not the workspace's.
wasmtime = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
harness-core.workspace = true
thiserror.workspace = true
regex.workspace = true
tempfile.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[lints]
workspace = true
