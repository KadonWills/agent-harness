# Built-in secret rules, in gitleaks rule format (see secrets.rs for the
# supported subset). Adapted from gitleaks' default ruleset (MIT).
title = "agentharness built-in rules"

[allowlist]
description = "obvious placeholders"
stopwords = ["example", "placeholder", "changeme", "dummy", "your_", "xxxxxxxx", "redacted"]
regexes = ['''^\$\{?[A-Z_][A-Z0-9_]*\}?$''', '''^<[^>]+>$''']

[[rules]]
id = "aws-access-token"
description = "AWS access key ID"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
entropy = 3.0
keywords = ["a3t", "akia", "asia", "abia", "acca"]

[[rules]]
id = "github-pat"
description = "GitHub personal access token"
regex = '''\b(ghp_[0-9a-zA-Z]{36})\b'''
keywords = ["ghp_"]

[[rules]]
id = "github-fine-grained-pat"
description = "GitHub fine-grained personal access token"
regex = '''\b(github_pat_\w{82})\b'''
keywords = ["github_pat_"]

[[rules]]
id = "github-oauth-or-app-token"
description = "GitHub OAuth or app token"
regex = '''\b((?:gho|ghu|ghs|ghr)_[0-9a-zA-Z]{36})\b'''
keywords = ["gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "gitlab-pat"
description = "GitLab personal access token"
regex = '''\b(glpat-[\w-]{20})\b'''
keywords = ["glpat-"]

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''\b(xox[baprs]-[0-9a-zA-Z-]{10,250})\b'''
keywords = ["xoxb", "xoxa", "xoxp", "xoxr", "xoxs"]

[[rules]]
id = "slack-webhook-url"
description = "Slack incoming webhook URL"
regex = '''(https://hooks\.slack\.com/(?:services|workflows)/[A-Za-z0-9+/]{43,56})'''
keywords = ["hooks.slack.com"]

[[rules]]
id = "stripe-access-token"
description = "Stripe secret or restricted key"
regex = '''\b((?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{10,99})\b'''
keywords = ["sk_test", "sk_live", "sk_prod", "rk_test", "rk_live", "rk_prod"]

[[rules]]
id = "gcp-api-key"
description = "Google API key"
regex = '''\b(AIza[\w-]{35})\b'''
keywords = ["aiza"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\b(sk-ant-(?:api03|admin01)-[\w-]{80,120})\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''\b(sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,200})\b'''
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]

[[rules]]
id = "npm-access-token"
description = "npm access token"
regex = '''(?i)\b(npm_[a-z0-9]{36})\b'''
keywords = ["npm_"]

[[rules]]
id = "pypi-upload-token"
description = "PyPI upload token"
regex = '''(pypi-AgEIcHlwaS5vcmc[\w-]{50,})'''
keywords = ["pypi-ageichlwas5vcmc"]

[[rules]]
id = "sendgrid-api-token"
description = "SendGrid API key"
regex = '''\b(SG\.[\w-]{22}\.[\w-]{43})\b'''
keywords = ["sg."]

[[rules]]
id = "private-key"
description = "Private key block"
regex = '''(-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----)'''
keywords = ["-----begin"]

[[rules]]
id = "generic-api-key"
description = "High-entropy value assigned to a secret-looking name"
regex = '''(?i)(?:api[_-]?key|secret|token|passw(?:or)?d|credential)s?["']?\s*[:=]\s*["']([^"'\s]{16,})["']'''
entropy = 3.5
keywords = ["key", "secret", "token", "passw", "credential"]
