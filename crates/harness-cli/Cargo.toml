[package]
name = "harness-cli"
description = "AgentHarness command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[features]
default = []
# The WASI sandbox backend (sandbox.provider = "wasmtime").
wasmtime = ["harness-runtime/wasmtime"]
# `harness tui`, the terminal UI (RFC-0002).
tui = ["dep:ratatui"]

[dependencies]
harness-core.workspace = true
harness-ast = { workspace = true, features = ["full"] }
harness-runtime.workspace = true
harness-security.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
ratatui = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
