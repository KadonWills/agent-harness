[workspace]
resolver = "2"
members = [
    "crates/harness-cli",
    "crates/harness-core",
    "crates/harness-ast",
    "crates/harness-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KadonWills/agent-harness"
homepage = "https://github.com/KadonWills/agent-harness"
authors = ["AgentHarness Contributors"]

[workspace.dependencies]
harness-core = { path = "crates/harness-core", version = "0.1.0" }
harness-ast = { path = "crates/harness-ast", version = "0.1.0" }
harness-runtime = { path = "crates/harness-runtime", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
