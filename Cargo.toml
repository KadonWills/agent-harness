[workspace]
resolver = "2"
members = [
    "crates/harness-cli",
    "crates/harness-core",
    "crates/harness-ast",
    "crates/harness-runtime",
    "crates/harness-security",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KadonWills/agent-harness"
homepage = "https://github.com/KadonWills/agent-harness"
authors = ["AgentHarness Contributors"]

[workspace.dependencies]
harness-core = { path = "crates/harness-core", version = "0.1.0" }
harness-ast = { path = "crates/harness-ast", version = "0.1.0" }
harness-runtime = { path = "crates/harness-runtime", version = "0.1.0" }
harness-security = { path = "crates/harness-security", version = "0.1.0" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
tempfile = "3"
sha2 = "0.10"
tree-sitter = "0.27"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p1"] }
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync"] }
getrandom = "0.4"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
