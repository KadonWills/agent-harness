labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are the cheap first step before an issue or an RFC. Describe
        the problem first; the solution can change.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and who else hits it?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
  - type: dropdown
    id: contract
    attributes:
      label: Would it change a public contract?
      description: harness.toml, AgentManifest.json, the LanguageParser or SandboxBackend traits, or CLI commands, flags, or exit codes. If yes, it will need an RFC (docs/rfcs/README.md).
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
