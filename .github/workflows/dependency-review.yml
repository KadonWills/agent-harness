name: Dependency review

# P2 of the PRD applied to this repository itself: no PR adds a vulnerable
# or non-allowlisted dependency. cargo-deny (security.yml) checks the whole
# tree; this checks the delta and comments inline on the PR.
on:
  pull_request:

# A new push to a PR cancels its superseded runs. Other events group by commit,
# so every commit merged to main still gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: New dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Mirror deny.toml's allowlist so the two gates cannot disagree.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause,
            BSD-3-Clause, ISC, Unicode-3.0, Zlib
