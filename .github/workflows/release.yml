name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p harness-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin=harness; [ "${{ runner.os }}" = "Windows" ] && bin=harness.exe
          cp "target/${{ matrix.target }}/release/$bin" dist/
          cd dist
          tar czf "harness-${{ matrix.target }}.tar.gz" "$bin"
          shasum -a 256 "harness-${{ matrix.target }}.tar.gz" > "harness-${{ matrix.target }}.tar.gz.sha256" || \
            sha256sum "harness-${{ matrix.target }}.tar.gz" > "harness-${{ matrix.target }}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: true
