name: Coverage

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its superseded runs. Other events group by commit,
# so every commit merged to main still gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65 # cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      # REQUIRES the CODECOV_TOKEN repository secret. Codecov no longer accepts
      # tokenless uploads, so without it this step logs
      #   "Token required - not valid tokenless upload"
      # and, because fail_ci_if_error is false, still reports success — the job
      # goes green while uploading nothing, and the codecov.yml thresholds below
      # never apply to anything. Get the token from
      # https://app.codecov.io/gh/KadonWills/agent-harness/settings then run:
      #   gh secret set CODECOV_TOKEN --repo KadonWills/agent-harness
      - name: Upload to Codecov
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          files: lcov.info
          # Keep false only while the token is missing: flipping it to true
          # before then turns every PR and every push to main red.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
# Thresholds (patch >= 70%, project must not drop >1%) are enforced by
# codecov via codecov.yml at the repo root — but only once uploads succeed.
