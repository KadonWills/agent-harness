name: Semver

# DISABLED until the first crates.io publish — see docs/adr/0005-crate-naming.md.
#
# cargo-semver-checks diffs the working tree against the *published* crate of
# the same name. `harness-core`, `harness-cli`, and `harness-runtime` are all
# already taken on crates.io by unrelated projects, so this check downloaded a
# stranger's crate and reported its API as "removed", then hard-errored on
# `harness-ast`, which is unpublished. The result was noise, not a signal.
#
# Restore the `pull_request` trigger in the same PR that publishes v0.1.0 under
# crate names this project actually owns.
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "crates/**"
  #     - "Cargo.toml"

permissions:
  contents: read
  pull-requests: read

jobs:
  semver-checks:
    name: API breakage (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if acknowledged breaking change
        id: ack
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          if echo "$LABELS" | grep -qw "breaking-change"; then
            echo "acknowledged=true" >> "$GITHUB_OUTPUT"
            echo "Breaking change acknowledged via label; skipping check."
          else
            echo "acknowledged=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        if: steps.ack.outputs.acknowledged == 'false'
        with:
          package: harness-core, harness-ast, harness-runtime
