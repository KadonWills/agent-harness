version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "area/ci"]
    # Without an explicit prefix Dependabot titles PRs "Bump x from a to b".
    # Supplying one makes it emit "chore(deps): bump x ..." — lowercase, and so
    # a valid conventional commit for the required PR-title check.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "area/ci"]
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        update-types: ["minor", "patch"]
