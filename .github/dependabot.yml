version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "area/ci"]
    # The prefix gives PRs a conventional type and scope: "chore(deps): ...".
    # Note that Dependabot still capitalizes the subject ("Bump x from a to b")
    # and offers no way to change that, so the subject alone would fail the
    # required PR-title check. The title job exempts dependabot[bot] for exactly
    # this reason — see .github/workflows/pr-validation.yml.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "area/ci"]
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        update-types: ["minor", "patch"]
